[package]
name = "bcs"
version = "0.1.0"
edition = "2024"
authors = ["static_noise"]

[[bin]]
name = "bcs"
path = "src/bin/bcs.rs"

[[bin]]
name = "bcsd"
path = "src/bin/bcsd.rs"

[dependencies]

serde = { version="1", features=["derive"]}
serde_json = "1.0"
bluer = { version = "0.17.4", features = ["bluetoothd"] }
futures = "0.3.34"
